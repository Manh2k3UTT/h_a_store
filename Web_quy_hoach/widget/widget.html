<link rel="stylesheet" href="./widget/widget.css">

<div class="map-widget-bar">
    <!-- 1. Chú giải -->
    <button class="widget-btn" id="btn-widget-legend" title="Chú giải" disabled>
        <svg class="widget-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>
        </svg>
    </button>

    <!-- 2. Chia sẻ -->
    <button class="widget-btn" id="btn-widget-share" title="Chia sẻ địa điểm">
        <svg class="widget-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
            <path d="M8.59 13.51l6.83 3.98M15.41 6.51l-6.82 3.98"/>
        </svg>
    </button>

    <!-- 3. Chụp ảnh -->
    <button class="widget-btn" id="btn-widget-screenshot" title="Chụp ảnh bản đồ">
        <svg class="widget-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
            <circle cx="12" cy="13" r="4"/>
        </svg>
    </button>

    <!-- 4. Đo diện tích -->
    <button class="widget-btn" id="btn-widget-measure-area" title="Đo diện tích">
        <svg class="widget-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 3h18v18H3z" stroke-dasharray="3 3"/>
            <path d="M3 3l18 18"/>
        </svg>
    </button>

    <!-- 5. Đo chiều dài -->
    <button class="widget-btn" id="btn-widget-measure-length" title="Đo chiều dài">
        <svg class="widget-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M2 12h20M6 9v6M10 10v4M14 9v6M18 10v4"/>
        </svg>
    </button>

    <!-- 6. Bỏ thao tác -->
    <button class="widget-btn btn-cancel" id="btn-widget-cancel" title="Bỏ thao tác">
        <svg class="widget-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
    </button>
</div>

<!-- Modal Popup Chia Sẻ -->
<div id="share-modal" class="widget-modal hidden">
    <div class="widget-modal-content">
        <div class="widget-modal-header">
            <span>Chia sẻ vị trí bản đồ</span>
            <button id="btn-close-share-modal">&times;</button>
        </div>
        <div class="widget-modal-body">
            <input type="text" id="share-url-input" readonly>
            <button id="btn-copy-share-url">Sao chép</button>
        </div>
    </div>
</div>
