<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Web GIS Quy Hoạch</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Style của Widget (Nên đặt ở head thay vì load động) -->
    <link rel="stylesheet" href="./widget/widget.css">

    <style>
        /* 1. Global Reset & Bố cục chung */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            /* overflow: hidden; */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }

        /* 2. Khung Flexbox chia 2 cột (Sidebar + Map) */
        .app-container {
            display: flex;
            width: 100vw;
            height: 100vh;
        }

        #sidebar-container {
            height: 100%;
            z-index: 1000;
        }

        #map {
            flex: 1;
            height: 100%;
            position: relative;
            z-index: 1;
        }

        /* 3. Nhúng map.html làm Widget điều khiển góc dưới bên trái */
        #map-widget-frame {
            position: absolute;
            bottom: 25px;    
            left: 15px;      
            width: 280px;
            height: 50px; 
            border: none;
            z-index: 1000;
            background: transparent;
        }

        /* Container chứa các Tool Widgets load động */
        #widget-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Tránh cản trở click vào bản đồ khi không tương tác với widget */
            z-index: 1001;
        }

        /* Bật lại click cho các phần tử con bên trong widget */
        #widget-container > * {
            pointer-events: auto;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- 1. VỊ TRÍ NHÚNG SIDEBAR -->
        <div id="sidebar-container"></div>

        <!-- 2. KHUNG BẢN ĐỒ -->
        <div id="map">
            <!-- Frame chứa Box điều khiển từ map.html -->
            <iframe id="map-widget-frame" src="map.html" title="Điều khiển bản đồ"></iframe>

            <!-- Container nạp động các widget công cụ (Thuộc về lớp hiển thị trên map) -->
            <div id="widget-container"></div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-image@0.4.0/leaflet-image.js"></script>
    <script src="https://unpkg.com/@turf/turf/turf.min.js"></script>

    <!-- Map & Core App Scripts -->
    <script>
        // 1. Khởi tạo bản đồ Leaflet
        const map = L.map('map', { attributionControl: false, preferCanvas: true }).setView([20.9375, 106.3286], 12);

        // Thêm bản quyền vào góc dưới bên phải
        L.control.attribution({ position: 'bottomright' }).addTo(map);

        // 2. Tạo Pane riêng cho GeoServer WMS
        map.createPane('quyhoachPane');
        map.getPane('quyhoachPane').style.zIndex = 450;

        map.createPane('measurePane');
        map.getPane('measurePane').style.zIndex = 10000;

        // 3. Khai báo các lớp Bản đồ nền
        const baseLayers = {
            googleSat: L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
                maxZoom: 20, 
                attribution: '© Google Maps',
                crossOrigin: 'anonymous'
            }),
            osm: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19, 
                attribution: '© OpenStreetMap',
                crossOrigin: 'anonymous'
            }),
            esriSat: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                maxZoom: 19, 
                attribution: '© Esri',
                crossOrigin: 'anonymous'
            }),
            cartoPositron: L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
                maxZoom: 20, 
                attribution: '© CartoDB',
                crossOrigin: 'anonymous'
            })
        };

        // Set lớp nền mặc định
        let currentBaseLayer = baseLayers.googleSat.addTo(map);

        // 4. Khai báo Lớp GeoServer WMS
        const geoserverUrl = 'http://localhost:8080/geoserver/quyhoach/wms';
        const quyHoachLayer = L.tileLayer.wms(geoserverUrl, {
            layers: 'quyhoach:Vi_tri_quy_hoach',
            styles: '',
            format: 'image/png',
            transparent: true,
            version: '1.1.0',
            opacity: 1.0,
            pane: 'quyhoachPane',
            maxZoom: 22,         
            maxNativeZoom: 19,
            crossOrigin: 'anonymous'
        }).addTo(map);

        // 5. Lắng nghe sự kiện truyền từ map.html (Iframe)
        const widgetFrame = document.getElementById('map-widget-frame');

        window.addEventListener('message', (event) => {
            const data = event.data;
            if (!data || !data.type) return;

            // Bật/Tắt Lớp GeoServer
            if (data.type === 'TOGGLE_GEOSERVER') {
                if (data.visible) {
                    map.addLayer(quyHoachLayer);
                    quyHoachLayer.bringToFront();
                } else {
                    map.removeLayer(quyHoachLayer);
                }
            }

            // Thay đổi Độ trong suốt
            if (data.type === 'CHANGE_OPACITY') {
                quyHoachLayer.setOpacity(data.opacity);
            }

            // Thay đổi Bản đồ nền
            if (data.type === 'CHANGE_BASEMAP') {
                if (currentBaseLayer) {
                    map.removeLayer(currentBaseLayer);
                }
                currentBaseLayer = baseLayers[data.basemapKey];
                if (currentBaseLayer) {
                    currentBaseLayer.addTo(map);
                }

                if (map.hasLayer(quyHoachLayer)) {
                    quyHoachLayer.bringToFront();
                }
            }

            // Thay đổi chiều cao Iframe
            if (data.type === 'RESIZE_WIDGET') {
                widgetFrame.style.height = data.isOpen ? '350px' : '50px';
            }
        });

    </script>

    <script src="./widget/widget-component.js"></script>

    <script src="./widget/share.js"></script>
    <script src="./widget/screenshot.js"></script>
    <script Src="./widget/measure-area.js"></script>
    <script src="./widget/measure-length.js"></script>
    <script src="./widget/cancel-action.js"></script>

    <script src="project-handler.js"></script>
</body>
</html>
