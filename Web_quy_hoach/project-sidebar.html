<link rel="stylesheet" href="project-sidebar.css" />

<div id="sidebar-panel" class="sidebar">
    <!-- Header Sidebar -->
    <div class="sidebar-header">
        <h3>THÔNG TIN QUY HOẠCH</h3>
        <button id="btn-close-sidebar" title="Đóng panel">&times;</button>
    </div>

    <div class="sidebar-body">
        <!-- 1. Trạng thái Mặc định (khi chưa click dự án) -->
        <div id="sidebar-empty" class="empty-state">
            <p>👈 Nhấp vào một dự án hoặc vùng quy hoạch trên bản đồ để xem thông tin chi tiết.</p>
        </div>

        <!-- 2. Khung Chi tiết Dự án (mặc định ẩn, bật khi có dữ liệu) -->
        <div id="sidebar-detail" class="detail-container hidden">
            
            <!-- Nhóm: Đồ án quy hoạch -->
            <div class="section-title">ĐỒ ÁN QUY HOẠCH</div>
            
            <table class="info-table">
                <tbody>
                    <tr>
                        <td class="info-label">Tên đồ án:</td>
                        <td class="info-value"><strong id="info-ten-du-an">--</strong></td>
                    </tr>
                    <tr>
                        <td class="info-label">Địa điểm:</td>
                        <td class="info-value" id="info-dia-diem">--</td>
                    </tr>
                    <tr>
                        <td class="info-label">Diện tích:</td>
                        <td class="info-value" id="info-dien-tich">--</td>
                    </tr>
                    <tr>
                        <td class="info-label">Dân số:</td>
                        <td class="info-value" id="info-dan-so">--</td>
                    </tr>
                    <tr>
                        <td class="info-label">Quyết định:</td>
                        <td class="info-value" id="info-quyet-dinh">--</td>
                    </tr>
                    <tr>
                        <td class="info-label">Cơ quan phê duyệt:</td>
                        <td class="info-value" id="info-don-vi">--</td>
                    </tr>
                </tbody>
            </table>

            <!-- Nhóm: Hồ sơ pháp lý đính kèm -->
            <div class="section-title">CƠ SỞ DỮ LIỆU SỐ PHÁP LÝ</div>
            <div id="info-files-container" class="file-list">
                <!-- Nơi JS thêm các thẻ link PDF -->
            </div>

            <!-- Nhóm: Các lớp bản vẽ Toggle (Nếu có) -->
            <div class="section-title">BẢN VẼ QUY HOẠCH</div>
            <div id="info-layers-container" class="layer-list">
                <!-- Nơi JS thêm các nút bật/tắt Layer -->
            </div>

            <!-- MẪU TEMPLATE: Trình duyệt tự ẩn, dùng để JS nhân bản khi nạp layer -->
            <template id="tpl-layer-item">
                <div class="layer-item" style="background: #f8f9fa; padding: 10px; border-radius: 6px; margin-bottom: 8px; border: 1px solid #e9ecef;">
                    <!-- Hàng 1: Tên Layer & Nút Bật/Tắt -->
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <span class="layer-name" style="font-weight: 600; font-size: 13px; color: #333;">--</span>
                        <label class="switch">
                            <input type="checkbox" class="layer-checkbox">
                            <span class="slider"></span>
                        </label>
                    </div>
                    
                    <!-- Hàng 2: Thanh trượt & Hiển thị phần trăm (%) -->
                    <div style="margin-top: 8px;">
                        <div style="display: flex; justify-content: space-between; font-size: 11px; color: #666; margin-bottom: 4px;">
                            <!-- <span>Độ trong suốt:</span>
                            <span class="opacity-val">100%</span> -->
                        </div>
                        <input type="range" class="layer-opacity" min="0" max="1" step="0.01" value="1" style="width: 100%; cursor: pointer;">
                    </div>
                </div>
            </template>

        </div>
    </div>
</div>
